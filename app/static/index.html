<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hinglish Transcribe & Clean</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        .btn-secondary {
            background-color: #e74c3c;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #c0392b;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .status {
            text-align: center;
            margin-bottom: 15px;
            font-weight: 500;
            min-height: 24px;
        }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
        .loading { color: #3498db; }

        /* New Layout Styles */
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .result-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .copy-btn {
            align-self: flex-end;
            padding: 5px 10px;
            font-size: 12px;
            background-color: #ddd;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        .copy-btn:hover { background-color: #ccc; }
        .conversion-controls {
            background: #eee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #ddd;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            line-height: 1.6;
            resize: vertical;
            background-color: #fafafa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Hinglish Transcriber</h1>

        <div class="form-group">
            <label for="filePath">Source File Path</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="filePath" placeholder="C:\videos\my_video.mp4" style="flex: 1;">
                <button id="browseBtn" class="btn-secondary" style="flex: 0 0 auto; width: auto; padding: 0 20px;">Browse</button>
            </div>
        </div>

        <div class="form-group">
            <label for="modelSelect">Whisper Model</label>
            <select id="modelSelect">
                <option value="">Loading models...</option>
            </select>
        </div>

        <div class="actions">
            <button id="processBtn" class="btn-primary">Start Processing</button>
            <button id="clearBtn" class="btn-secondary">Clear Temp Files</button>
        </div>

        <div id="status" class="status"></div>

        <div id="devnagari-section" style="display: none;">
            <div class="conversion-controls" style="display: block;">
                <label style="font-weight: bold; margin-bottom: 10px; display: block;">Devnagari Options</label>
                <div style="display: flex; gap: 20px; margin-bottom: 15px;">
                    <label style="font-weight: normal; cursor: pointer;">
                        <input type="radio" name="convType" value="partial" checked> Keep English as English
                    </label>
                    <label style="font-weight: normal; cursor: pointer;">
                        <input type="radio" name="convType" value="full"> Full Devnagari Conversion
                    </label>
                </div>
                <button id="convertBtn" class="btn-primary" style="width: auto; padding: 8px 20px;">Convert to Devnagari ➔</button>
            </div>

            <div class="result-grid">
                <div class="result-box">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label>Romanized Hinglish</label>
                        <button class="copy-btn" onclick="copyText('resultText')">Copy</button>
                    </div>
                    <textarea id="resultText" readonly placeholder="The processed transcript will appear here..."></textarea>
                </div>
                <div class="result-box">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label>Hindi (Devnagari)</label>
                        <button class="copy-btn" onclick="copyText('devnagariText')">Copy</button>
                    </div>
                    <textarea id="devnagariText" readonly placeholder="Conversion result..."></textarea>
                </div>
            </div>
        </div>

        <div id="single-result" style="display: none;">
            <div class="result-box">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label>Romanized Hinglish</label>
                    <button class="copy-btn" onclick="copyText('resultTextSingle')">Copy</button>
                </div>
                <textarea id="resultTextSingle" readonly placeholder="The processed transcript will appear here..."></textarea>
            </div>
        </div>
    </div>

    <script>
        const filePathInput = document.getElementById('filePath');
        const browseBtn = document.getElementById('browseBtn');
        const modelSelect = document.getElementById('modelSelect');
        const processBtn = document.getElementById('processBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultText = document.getElementById('resultText');
        const devnagariText = document.getElementById('devnagariText');
        const statusDiv = document.getElementById('status');

        function setStatus(msg, type = '') {
            statusDiv.textContent = msg;
            statusDiv.className = 'status ' + type;
        }

        function copyText(id) {
            const text = document.getElementById(id).value;
            navigator.clipboard.writeText(text);
            alert('Copied to clipboard!');
        }

        async function loadModels() {
            try {
                const response = await fetch('/models');
                const data = await response.json();
                modelSelect.innerHTML = '';
                data.models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model;
                    option.textContent = model;
                    modelSelect.appendChild(option);
                });
            } catch (err) {
                setStatus('Error loading models', 'error');
            }
        }

        browseBtn.onclick = async () => {
            setStatus('Opening file picker...', 'loading');
            try {
                const response = await fetch('/pick-file');
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'File selection cancelled');
                }
                const data = await response.json();
                filePathInput.value = data.path;
                setStatus('File selected', 'success');
            } catch (err) {
                setStatus(err.message, 'error');
            }
        };

        processBtn.onclick = async () => {
            const path = filePathInput.value.trim();
            const model = modelSelect.value;

            if (!path) {
                setStatus('Please enter a source file path', 'error');
                return;
            }
            if (!model) {
                setStatus('Please select a model', 'error');
                return;
            }

            processBtn.disabled = true;
            resultText.value = '';
            devnagariText.value = '';
            document.getElementById('devnagari-section').style.display = 'none';
            setStatus('Processing... (FFmpeg ➔ Whisper ➔ Ollama)', 'loading');

            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path, model })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Transcription failed');
                }

                const data = await response.json();
                resultText.value = data.text;
                document.getElementById('devnagari-section').style.display = 'block';
                setStatus('Completed successfully!', 'success');
            } catch (err) {
                setStatus(err.message, 'error');
            } finally {
                processBtn.disabled = false;
            }
        };

        document.getElementById('convertBtn').onclick = async () => {
            const text = resultText.value;
            const convType = document.querySelector('input[name="convType"]:checked').value;

            if (!text) {
                setStatus('No text to convert', 'error');
                return;
            }

            setStatus('Converting to Devnagari...', 'loading');
            try {
                const response = await fetch('/convert-devnagari', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        full_conversion: convType === 'full'
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Conversion failed');
                }

                const data = await response.json();
                devnagariText.value = data.text;
                setStatus('Converted to Devnagari successfully!', 'success');
            } catch (err) {
                setStatus(err.message, 'error');
            }
        };

        clearBtn.onclick = async () => {
            if (!confirm('Are you sure you want to clear all intermediate files in the temp folder?')) return;
            try {
                const response = await fetch('/temp', { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to clear temp files');
                setStatus('Temp files cleared', 'success');
            } catch (err) {
                setStatus(err.message, 'error');
            }
        };

        loadModels();
    </script>
</body>
</html>
