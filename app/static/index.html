<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxRefine | Professional AI Transcription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* slate-950 */
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .status-step {
            transition: all 0.3s ease;
        }
        .status-active {
            color: #6366f1; /* indigo-500 */
            font-weight: 600;
        }
        .status-complete {
            color: #10b981; /* emerald-500 */
        }
        .status-pending {
            color: #475569; /* slate-500 */
        }
        .loader {
            border-top-color: #6366f1;
            animation: spinner 0.6s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen pb-12">

    <!-- Header -->
    <nav class="border-b border-slate-800 bg-slate-900/50 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg">
                    <i class="fas fa-microphone-lines text-white text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">VoxRefine <span class="text-indigo-400 font-medium text-sm ml-2">v1.0</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <div id="healthBadge" class="px-3 py-1 rounded-full text-xs font-medium flex items-center gap-2 transition-colors duration-300">
                    <span class="w-2 h-2 rounded-full bg-current"></span>
                    <span id="healthText">Checking Health...</span>
                </div>
                <button id="settingsBtn" class="p-2 rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
                    <i class="fas fa-cog text-lg"></i>
                </button>
            </div>
        </nav>

    <main class="max-w-7xl mx-auto px-4 mt-8 space-y-8">
        
        <!-- Control Panel -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 glass p-6 rounded-2xl space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-400 ml-1">Source Audio/Video File</label>
                        <div class="flex gap-2">
                            <input type="text" id="filePath" placeholder="C:\path\to\your\file.mp4" 
                                   class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                            <button id="browseBtn" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition-colors flex items-center gap-2">
                                <i class="fas fa-folder-open"></i> Browse
                            </button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-400 ml-1">Whisper Model</label>
                        <div class="relative">
                            <select id="modelSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all appearance-none cursor-pointer">
                                <option value="">Loading models...</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-500">
                                <i class="fas fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-4 border-t border-slate-800">
                    <div id="status" class="text-sm font-medium text-slate-500 flex items-center gap-2">
                        Ready to process
                    </div>
                    <div class="flex gap-3">
                        <button id="clearBtn" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-rose-400 transition-colors">
                            Clear Temp Files
                        </button>
                        <button id="processBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-xl text-sm font-bold transition-all flex items-center gap-2 shadow-lg shadow-indigo-500/20">
                            <i class="fas fa-play"></i> Start Processing
                        </button>
                        <button id="stopBtn" class="hidden bg-rose-600 hover:bg-rose-500 text-white px-6 py-2.5 rounded-xl text-sm font-bold transition-all flex items-center gap-2 shadow-lg shadow-rose-500/20">
                            <i class="fas fa-stop"></i> Stop
                        </button>
                    </div>
                </div>
            </div>

            <!-- Status Stepper -->
            <div class="glass p-6 rounded-2xl flex flex-col justify-center space-y-6">
                <h3 class="text-center text-sm font-semibold text-slate-400 uppercase tracking-wider">Pipeline Stage</h3>
                <div class="flex justify-between items-center relative">
                    <!-- Connecting Line -->
                    <div class="absolute top-1/2 left-0 w-full h-0.5 bg-slate-800 -z-10"></div>
                    
                    <div id="step-ffmpeg" class="status-step status-pending flex flex-col items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-slate-900 border-2 border-current flex items-center justify-center text-xs font-bold">1</div>
                        <span class="text-[10px] uppercase font-bold">FFmpeg</span>
                    </div>
                    <div id="step-whisper" class="status-step status-pending flex flex-col items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-slate-900 border-2 border-current flex items-center justify-center text-xs font-bold">2</div>
                        <span class="text-[10px] uppercase font-bold">Whisper</span>
                    </div>
                    <div id="step-ollama" class="status-step status-pending flex flex-col items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-slate-900 border-2 border-current flex items-center justify-center text-xs font-bold">3</div>
                        <span class="text-[10px] uppercase font-bold">Ollama</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Results Grid -->
        <section id="resultsSection" class="grid grid-cols-1 lg:grid-cols-3 gap-6 opacity-40 pointer-events-none transition-opacity duration-500">
            
            <!-- Raw Transcription -->
            <div class="glass rounded-2xl overflow-hidden flex flex-col">
                <div class="px-4 py-3 bg-slate-800/50 border-b border-slate-800 flex items-center justify-between">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400">Raw Transcription</h3>
                    <button onclick="copyText('resultText')" class="text-slate-500 hover:text-white transition-colors p-1">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
                <textarea id="resultText" readonly class="flex-1 w-full h-64 bg-transparent p-4 text-sm mono text-slate-300 outline-none resize-none" placeholder="Waiting for transcription..."></textarea>
            </div>

            <!-- Refined Hinglish -->
            <div class="glass rounded-2xl overflow-hidden flex flex-col">
                <div class="px-4 py-3 bg-slate-800/50 border-b border-slate-800 flex items-center justify-between">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400">Refined Hinglish</h3>
                    <button onclick="copyText('refinedText')" class="text-slate-500 hover:text-white transition-colors p-1">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
                <textarea id="refinedText" readonly class="flex-1 w-full h-64 bg-transparent p-4 text-sm mono text-indigo-300 outline-none resize-none" placeholder="Waiting for refinement..."></textarea>
            </div>

            <!-- Native Script -->
            <div class="glass rounded-2xl overflow-hidden flex flex-col border-indigo-500/30">
                <div class="px-4 py-3 bg-indigo-900/20 border-b border-slate-800 flex items-center justify-between">
                    <h3 id="nativeScriptResultLabel" class="text-xs font-bold uppercase tracking-widest text-indigo-400">Native Script</h3>
                    <button onclick="copyText('nativeText')" class="text-slate-500 hover:text-white transition-colors p-1">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
                
                <!-- Conversion Controls -->
                <div class="px-4 py-3 bg-slate-900/50 border-b border-slate-800 space-y-3">
                    <div class="flex items-center justify-between gap-4">
                        <div id="nativeScriptOptionsLabel" class="text-[10px] font-bold uppercase text-slate-500">Options</div>
                        <div class="flex items-center gap-4 text-xs">
                            <label class="flex items-center gap-2 cursor-pointer group">
                                <input type="radio" name="convType" value="partial" checked class="w-3 h-3 accent-indigo-500">
                                <span class="text-slate-400 group-hover:text-white transition-colors">Partial</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer group">
                                <input type="radio" name="convType" value="full" class="w-3 h-3 accent-indigo-500">
                                <span class="text-slate-400 group-hover:text-white transition-colors">Full</span>
                            </label>
                        </div>
                    </div>
                    <button id="convertBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2">
                        Convert to Native Script ➔
                    </button>
                </div>

                <textarea id="nativeText" readonly class="flex-1 w-full h-48 bg-transparent p-4 text-sm mono text-white outline-none resize-none" placeholder="Waiting for conversion..."></textarea>
            </div>
        </section>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="glass w-full max-w-md rounded-3xl overflow-hidden shadow-2xl animate-in fade-in zoom-in duration-200">
            <div class="px-6 py-4 bg-slate-800/50 border-b border-slate-700 flex items-center justify-between">
                <h2 class="text-lg font-bold text-white">Application Settings</h2>
                <button id="closeModal" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-400 uppercase ml-1">Ollama API URL</label>
                    <input type="text" id="ollamaUrl" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-400 uppercase ml-1">Ollama Model</label>
                    <input type="text" id="ollamaModel" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-400 uppercase ml-1">Ollama API Key</label>
                    <input type="password" id="ollamaApiKey" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-400 uppercase ml-1">Target Native Script</label>
                    <input type="text" id="targetScript" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
            </div>
            <div class="px-6 py-4 bg-slate-800/30 border-t border-slate-700 flex justify-end gap-3">
                <button id="cancelSettings" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors">Cancel</button>
                <button id="saveSettings" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-xl text-sm font-bold transition-all">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-6 right-6 z-[200] flex flex-col gap-3"></div>

    <script>
        // --- DOM Elements ---
        const filePathInput = document.getElementById('filePath');
        const browseBtn = document.getElementById('browseBtn');
        const modelSelect = document.getElementById('modelSelect');
        const processBtn = document.getElementById('processBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultText = document.getElementById('resultText');
        const refinedText = document.getElementById('refinedText');
        const nativeText = document.getElementById('nativeText');
        const statusDiv = document.getElementById('status');
        const healthBadge = document.getElementById('healthBadge');
        const healthText = document.getElementById('healthText');
        const nativeScriptResultLabel = document.getElementById('nativeScriptResultLabel');
        const resultsSection = document.getElementById('resultsSection');
        
        let currentTaskId = null;
        let currentAbortController = null;

        // Settings elements
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeModal = document.getElementById('closeModal');
        const cancelSettings = document.getElementById('cancelSettings');
        const saveSettings = document.getElementById('saveSettings');
        const ollamaUrlInput = document.getElementById('ollamaUrl');
        const ollamaModelInput = document.getElementById('ollamaModel');
        const ollamaApiKeyInput = document.getElementById('ollamaApiKey');
        const targetScriptInput = document.getElementById('targetScript');

        // --- Utility Functions ---

        function updateDynamicLabels() {
            fetch('/settings')
                .then(res => res.json())
                .then(data => {
                    const script = data.TARGET_SCRIPT || 'Devnagari';
                    const btn = document.getElementById('convertBtn');
                    if (btn) btn.textContent = `Convert to ${script} ➔`;
                    if (nativeScriptResultLabel) nativeScriptResultLabel.textContent = script;
                    
                    const optionsLabel = document.getElementById('nativeScriptOptionsLabel');
                    if (optionsLabel) optionsLabel.textContent = `${script} Options`;
                })
                .catch(err => console.error('Error updating labels:', err));
        }

        function setStatus(msg, type = '') {
            statusDiv.textContent = msg;
            statusDiv.className = 'text-sm font-medium transition-colors duration-300 ' + 
                                 (type === 'error' ? 'text-rose-400' : 
                                  type === 'success' ? 'text-emerald-400' : 
                                  type === 'loading' ? 'text-indigo-400' : 'text-slate-500');
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'glass px-4 py-3 rounded-xl text-sm text-white shadow-xl animate-in slide-in-from-right duration-300 border-l-4 border-indigo-500';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-full', 'transition-all', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function copyText(id) {
            const text = document.getElementById(id).value;
            navigator.clipboard.writeText(text);
            showToast('Copied to clipboard!');
        }

        function updateStep(stepId, state) {
            const step = document.getElementById(`step-${stepId}`);
            if (!step) return;
            step.className = `status-step flex flex-col items-center gap-2 status-${state}`;
        }

        async function checkHealth() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                if (data.status === 'healthy') {
                    healthBadge.className = 'px-3 py-1 rounded-full text-xs font-medium flex items-center gap-2 bg-emerald-500/10 text-emerald-500 border border-emerald-500/20';
                    healthText.textContent = 'System Healthy';
                } else {
                    healthBadge.className = 'px-3 py-1 rounded-full text-xs font-medium flex items-center gap-2 bg-rose-500/10 text-rose-500 border border-rose-500/20';
                    healthText.textContent = 'Issues Found';
                    if (data.missing) {
                        data.missing.forEach(item => showToast(`Missing: ${item}. Run setup.py`));
                    }
                }
            } catch (err) {
                healthBadge.className = 'px-3 py-1 rounded-full text-xs font-medium flex items-center gap-2 bg-slate-500/10 text-slate-500 border border-slate-500/20';
                healthText.textContent = 'Unknown Health';
            }
        }

        async function loadModels() {
            try {
                const response = await fetch('/models');
                const data = await response.json();
                modelSelect.innerHTML = '';
                data.models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model;
                    option.textContent = model;
                    modelSelect.appendChild(option);
                });
            } catch (err) {
                setStatus('Error loading models', 'error');
            }
        }

        // --- Event Handlers ---

        browseBtn.onclick = async () => {
            setStatus('Opening file picker...', 'loading');
            try {
                const response = await fetch('/pick-file');
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'File selection cancelled');
                }
                const data = await response.json();
                filePathInput.value = data.path;
                setStatus('File selected', 'success');
            } catch (err) {
                setStatus(err.message, 'error');
            }
        };

        processBtn.onclick = async () => {
            const path = filePathInput.value.trim();
            const model = modelSelect.value;

            if (!path || !model) {
                setStatus('Please provide file path and select a model', 'error');
                return;
            }

            currentTaskId = crypto.randomUUID();
            processBtn.disabled = true;
            stopBtn.classList.remove('hidden');
            const originalBtnText = processBtn.innerHTML;
            processBtn.innerHTML = '<div class="loader w-4 h-4 border-2 border-white rounded-full mr-2"></div> Processing...';

            resultText.value = '';
            refinedText.value = '';
            nativeText.value = '';
            resultsSection.classList.add('opacity-40', 'pointer-events-none');
            setStatus('Initializing...', 'loading');

            currentAbortController = new AbortController();

            // Reset and start polling
            ['ffmpeg', 'whisper', 'ollama'].forEach(s => updateStep(s, 'pending'));

            const statusInterval = setInterval(async () => {
                try {
                    const statusRes = await fetch(`/task-status?task_id=${currentTaskId}`);
                    const statusData = await statusRes.json();
                    if (statusData.status === 'processing') {
                        const stage = statusData.stage || 'unknown';
                        const stageNames = { 'ffmpeg': 'FFmpeg', 'whisper': 'Whisper', 'ollama': 'Ollama' };
                        setStatus(`Processing... (${stageNames[stage] || stage})`, 'loading');
                        
                        // Update Stepper
                        ['ffmpeg', 'whisper', 'ollama'].forEach(s => {
                            if (s === stage) updateStep(s, 'active');
                            else if (stage === 'whisper' && s === 'ffmpeg') updateStep(s, 'complete');
                            else if (stage === 'ollama' && (s === 'ffmpeg' || s === 'whisper')) updateStep(s, 'complete');
                        });
                    }
                } catch (err) { console.error(err); }
            }, 1000);

            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path, model, task_id: currentTaskId }),
                    signal: currentAbortController.signal
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Transcription failed');
                }

                const data = await response.json();
                resultText.value = data.text; // This is the refined Hinglish from the current pipeline
                refinedText.value = data.text; 
                
                resultsSection.classList.remove('opacity-40', 'pointer-events-none');
                updateStep('ollama', 'complete');
                const duration = data.duration ? ` in ${data.duration.toFixed(2)}s` : '';
                setStatus(`Completed successfully!${duration}`, 'success');
            } catch (err) {
                if (err.name === 'AbortError') setStatus('Stopped by user', 'success');
                else setStatus(err.message, 'error');
            } finally {
                clearInterval(statusInterval);
                processBtn.disabled = false;
                processBtn.innerHTML = originalBtnText;
                stopBtn.classList.add('hidden');
                currentTaskId = null;
                currentAbortController = null;
            }
        };

        stopBtn.onclick = async () => {
            if (currentAbortController) currentAbortController.abort();
            if (!currentTaskId) return;
            try {
                const response = await fetch(`/stop?task_id=${currentTaskId}`, { method: 'DELETE' });
                if (response.ok) setStatus('Task stopped successfully', 'success');
                else setStatus('Failed to stop task', 'error');
            } catch (err) { setStatus(err.message, 'error'); } finally {
                processBtn.disabled = false;
                processBtn.innerHTML = 'Start Processing';
                stopBtn.classList.add('hidden');
                currentTaskId = null;
                currentAbortController = null;
            }
        };

        document.getElementById('convertBtn').onclick = async () => {
            const text = refinedText.value;
            const convType = document.querySelector('input[name="convType"]:checked').value;
            if (!text) { setStatus('No text to convert', 'error'); return; }

            const btn = document.getElementById('convertBtn');
            const originalBtnText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="loader w-4 h-4 border-2 border-white rounded-full mr-2"></div> Converting...';
            
            setStatus('Converting to native script...', 'loading');
            try {
                const response = await fetch('/convert-native-script', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, full_conversion: convType === 'full' })
                });
                if (!response.ok) throw new Error('Conversion failed');
                const data = await response.json();
                nativeText.value = data.text;
                setStatus('Conversion complete!', 'success');
            } catch (err) { setStatus(err.message, 'error'); } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnText;
            }
        };

        clearBtn.onclick = async () => {
            if (!confirm('Clear all temp files?')) return;
            try {
                const response = await fetch('/temp', { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to clear temp files');
                showToast('Temp files cleared');
            } catch (err) { setStatus(err.message, 'error'); }
        };

        settingsBtn.onclick = async () => {
            try {
                const response = await fetch('/settings');
                const data = await response.json();
                ollamaUrlInput.value = data.OLLAMA_API_URL;
                ollamaModelInput.value = data.OLLAMA_MODEL;
                ollamaApiKeyInput.value = data.OLLAMA_API_KEY || '';
                targetScriptInput.value = data.TARGET_SCRIPT;
                settingsModal.style.display = 'flex';
            } catch (err) { showToast('Error loading settings'); }
        };

        closeModal.onclick = () => settingsModal.style.display = 'none';
        cancelSettings.onclick = () => settingsModal.style.display = 'none';

        saveSettings.onclick = async () => {
            const url = ollamaUrlInput.value.trim();
            const model = ollamaModelInput.value.trim();
            if (!url || !model) { alert('API URL and Model are required'); return; }
            try {
                const response = await fetch('/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        OLLAMA_API_URL: url,
                        OLLAMA_MODEL: model,
                        OLLAMA_API_KEY: ollamaApiKeyInput.value.trim() || null,
                        TARGET_SCRIPT: targetScriptInput.value.trim() || "Hindi (Devnagari)"
                    })
                });
                if (!response.ok) throw new Error('Save failed');
                showToast('Settings saved!');
                settingsModal.style.display = 'none';
                checkHealth();
                updateDynamicLabels();
            } catch (err) { alert(err.message); }
        };

        // Init
        loadModels();
        checkHealth();
        updateDynamicLabels();
    </script>
</body>
</html>
